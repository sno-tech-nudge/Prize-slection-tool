<!-- @dsCard group="Brand" viewport="700x200" name="The caret (^) mark" subtitle="Stands in for the logo — light or dark by context" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); }
  .row { display:flex; }
  .cell { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--space-3); height:150px; }
  .cell img { height:52px; }
  .cap { font-size:11px; letter-spacing:var(--ls-wide); text-transform:uppercase; }
  .on-light { background:var(--surface-card); } .on-light .cap { color:var(--text-secondary); }
  .on-grey { background:var(--surface-canvas); } .on-grey .cap { color:var(--text-secondary); }
  .on-dark { background:var(--delta-charcoal); } .on-dark .cap { color:#c7cbcb; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell on-light"><img src="../assets/logos/caret-red.svg" alt="caret red"><div class="cap">red · primary</div></div>
    <div class="cell on-grey"><img src="../assets/logos/caret-dark.svg" alt="caret dark"><div class="cap">charcoal · on light</div></div>
    <div class="cell on-dark"><img src="../assets/logos/caret-white.svg" alt="caret white"><div class="cap">white · on dark</div></div>
  </div>
</body>
</html>
