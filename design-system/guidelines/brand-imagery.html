<!-- @dsCard group="Brand" viewport="700x230" name="Imagery style" subtitle="~60% brand colour; colour photos shown in B&W; toned line art" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-card); padding:var(--space-6); }
  .row { display:flex; gap:var(--space-4); }
  figure { margin:0; flex:1; }
  .img { height:150px; background-size:cover; background-position:center; }
  .bw { filter:grayscale(1) contrast(1.05); }
  .cap { font-size:11px; color:var(--text-secondary); letter-spacing:var(--ls-wide); text-transform:uppercase; margin-top:var(--space-2); }
</style>
</head>
<body>
  <div class="row">
    <figure><div class="img bw" style="background-image:url(../assets/imagery/impact-woman-chulha.png)"></div><div class="cap">colour photo → black & white</div></figure>
    <figure><div class="img" style="background-image:url(../assets/imagery/khakra-entrepreneur.png)"></div><div class="cap">brand-toned · red + primaries lead</div></figure>
  </div>
</body>
</html>
