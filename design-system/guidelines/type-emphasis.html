<!-- @dsCard group="Type" viewport="700x200" name="Emphasis — Argent Italic" subtitle="Warmth & elegance on highlighted words only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-card); color:var(--text-primary); padding:var(--space-6); }
  .line { font-weight:var(--fw-light); font-size:var(--fs-h3); line-height:var(--lh-snug); margin:0; }
  em { font-family:var(--font-serif); font-style:italic; font-weight:500; color:var(--text-accent); }
  .role { font-family:var(--font-serif); font-style:italic; font-size:var(--fs-h4); color:var(--text-secondary); margin:var(--space-4) 0 0; }
  .meta { margin-top:var(--space-5); font-size:var(--fs-caption); color:var(--text-secondary); letter-spacing:var(--ls-wide); text-transform:uppercase; }
</style>
</head>
<body>
  <p class="line">transform your ideas into <em>impact</em></p>
  <p class="role">Founder, Sol's ARC</p>
  <div class="meta">Cormorant (Argent) · italic · emphasis + roles + taglines</div>
</body>
</html>
