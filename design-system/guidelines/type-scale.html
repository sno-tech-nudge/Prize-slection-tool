<!-- @dsCard group="Type" viewport="700x260" name="Type scale" subtitle="Display 64 → caption 12" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-card); color:var(--text-primary); padding:var(--space-6); }
  .r { display:flex; align-items:baseline; gap:var(--space-4); margin-bottom:var(--space-2); }
  .r span.sample { font-weight:var(--fw-bold); text-transform:lowercase; line-height:1.1; }
  .r span.tag { font-size:11px; color:var(--text-secondary); letter-spacing:var(--ls-wide); text-transform:uppercase; white-space:nowrap; }
</style>
</head>
<body>
  <div class="r"><span class="sample" style="font-size:var(--fs-display)">delta</span><span class="tag">display · 64</span></div>
  <div class="r"><span class="sample" style="font-size:var(--fs-h1)">delta</span><span class="tag">h1 · 44</span></div>
  <div class="r"><span class="sample" style="font-size:var(--fs-h2)">delta</span><span class="tag">h2 · 32</span></div>
  <div class="r"><span class="sample" style="font-size:var(--fs-h3)">delta</span><span class="tag">h3 · 24</span></div>
  <div class="r"><span class="sample" style="font-size:var(--fs-body);font-weight:var(--fw-light)">delta</span><span class="tag">body · 16 · light</span></div>
  <div class="r"><span class="sample" style="font-size:var(--fs-caption);font-weight:var(--fw-light)">delta</span><span class="tag">caption · 12</span></div>
</body>
</html>
