<!-- @dsCard group="Colors" viewport="700x150" name="Neutral / slate scale" subtitle="Charcoal → the blank-canvas grey" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-card); color:var(--text-primary); }
  .scale { display:flex; padding:var(--space-6); gap:0; }
  .step { flex:1; }
  .chip { height:72px; }
  .lbl { font-size:11px; color:var(--text-secondary); margin-top:var(--space-2); letter-spacing:var(--ls-wide); text-transform:uppercase; }
</style>
</head>
<body>
  <div class="scale">
    <div class="step"><div class="chip" style="background:var(--grey-900)"></div><div class="lbl">900</div></div>
    <div class="step"><div class="chip" style="background:var(--grey-800)"></div><div class="lbl">800</div></div>
    <div class="step"><div class="chip" style="background:var(--grey-600)"></div><div class="lbl">600</div></div>
    <div class="step"><div class="chip" style="background:var(--grey-500)"></div><div class="lbl">500</div></div>
    <div class="step"><div class="chip" style="background:var(--grey-400)"></div><div class="lbl">400</div></div>
    <div class="step"><div class="chip" style="background:var(--grey-300)"></div><div class="lbl">300</div></div>
    <div class="step"><div class="chip" style="background:var(--grey-200)"></div><div class="lbl">200</div></div>
    <div class="step"><div class="chip" style="background:var(--grey-100)"></div><div class="lbl">100</div></div>
    <div class="step"><div class="chip" style="background:var(--grey-050);border:1px solid var(--border-subtle)"></div><div class="lbl">050</div></div>
  </div>
</body>
</html>
