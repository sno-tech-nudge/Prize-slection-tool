<!-- @dsCard group="Type" viewport="700x220" name="Headings — Avenir Bold, lowercase" subtitle="Clean, contemporary, commands attention" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-card); color:var(--text-primary); padding:var(--space-6); }
  .h1 { font-weight:var(--fw-bold); font-size:var(--fs-h1); text-transform:lowercase; line-height:var(--lh-tight); letter-spacing:var(--ls-tight); margin:0; }
  .h2 { font-weight:var(--fw-bold); font-size:var(--fs-h3); text-transform:lowercase; line-height:var(--lh-snug); margin:var(--space-3) 0 0; }
  .meta { margin-top:var(--space-4); font-size:var(--fs-caption); color:var(--text-secondary); letter-spacing:var(--ls-wide); text-transform:uppercase; }
</style>
</head>
<body>
  <p class="h1">transform your ideas into impact</p>
  <p class="h2">the caret marks a shift</p>
  <div class="meta">Mulish (Avenir) · 700 · lowercase</div>
</body>
</html>
